server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service

app:
  jwt:
    # Dev-only default. Override with the JWT_SECRET env var in every non-local environment.
    secret: ${JWT_SECRET:dev-only-insecure-secret-key-change-me-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    probes:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [correlationId=%X{correlationId:-none}] %logger{36} - %msg%n"
  level:
    com.aiops.auth: INFO
